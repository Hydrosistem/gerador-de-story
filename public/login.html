<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar | Lar de Achadinhos</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111318;color:#17191d;font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;padding:16px}
.card{width:100%;max-width:370px;background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 20px 50px #0006}
h1{margin:0 0 4px;font-size:21px}p{margin:0 0 20px;color:#68707d;font-size:12px}
label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}
input{width:100%;border:1px solid #d7dce3;border-radius:9px;padding:12px;font:inherit;margin-bottom:13px}
input:focus{outline:2px solid #b8f2ce;border-color:#12a45a}
button{width:100%;border:0;border-radius:10px;padding:14px;background:#0c9e51;color:#fff;font:700 14px inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.err{min-height:18px;color:#b42318;font-size:12px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<form class="card" id="f">
 <h1>🏠 Lar de Achadinhos</h1>
 <p>Gerador de artes de oferta. Entre para continuar.</p>
 <label for="user">Usuário</label><input id="user" autocomplete="username" autocapitalize="none" required>
 <label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required>
 <button id="go">Entrar</button>
 <div class="err" id="err" aria-live="polite"></div>
</form>
<script>
const $=id=>document.getElementById(id);
$('f').onsubmit=async e=>{
 e.preventDefault();$('go').disabled=true;$('err').textContent='';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('user').value,password:$('password').value})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Não foi possível entrar.');
  location.replace('/'+location.hash);
 }catch(err){$('err').textContent=err.message;$('password').select()}
 finally{$('go').disabled=false}
};
$('user').focus();
</script>
</body>
</html>
