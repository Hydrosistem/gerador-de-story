<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo do Gerador de Story: cartão de story em pé com brilho (família do ícone do Gerador de Post).
       Quadrado cheio, conteúdo dentro da zona segura dos ícones "maskable" (círculo de raio 205). -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34e27f"/>
      <stop offset=".55" stop-color="#1fb85a"/>
      <stop offset="1" stop-color="#128c7e"/>
    </linearGradient>
    <linearGradient id="foto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243049"/>
      <stop offset="1" stop-color="#151b29"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#064e3b" flood-opacity=".38"/>
    </filter>
    <filter id="sombraBrilho" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#7a5200" flood-opacity=".3"/>
    </filter>
    <clipPath id="recorteFoto"><rect x="188" y="142" width="136" height="150" rx="16"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#fundo)"/>

  <!-- Cartão do story -->
  <rect x="166" y="96" width="180" height="320" rx="34" fill="#fff" filter="url(#sombra)"/>

  <!-- Barrinhas de progresso do story -->
  <rect x="188" y="118" width="40" height="7" rx="3.5" fill="#128c7e"/>
  <rect x="236" y="118" width="40" height="7" rx="3.5" fill="#c5ecdb"/>
  <rect x="284" y="118" width="40" height="7" rx="3.5" fill="#c5ecdb"/>

  <!-- Foto do produto -->
  <g clip-path="url(#recorteFoto)">
    <rect x="188" y="142" width="136" height="150" fill="url(#foto)"/>
    <circle cx="296" cy="176" r="15" fill="#ffc61a"/>
    <path d="M182 296 L232 222 L262 260 L284 236 L330 296 Z" fill="#25d366"/>
    <path d="M262 260 L284 236 L330 296 L292 296 Z" fill="#1fb85a"/>
  </g>

  <!-- Etiqueta de preço -->
  <rect x="188" y="308" width="96" height="36" rx="18" fill="#25d366"/>
  <text x="236" y="333" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="21" fill="#fff">R$</text>

  <!-- Linhas de texto -->
  <rect x="188" y="358" width="124" height="13" rx="6.5" fill="#d3d8df"/>
  <rect x="188" y="381" width="78" height="11" rx="5.5" fill="#e6e9ee"/>

  <!-- Brilho -->
  <path d="M374 64 Q380 112 428 118 Q380 124 374 172 Q368 124 320 118 Q368 112 374 64 Z" fill="#ffc61a" filter="url(#sombraBrilho)"/>
</svg>
